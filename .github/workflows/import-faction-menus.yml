name: Import all four faction illustrated HUD assets

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "GitHub attachment URL of the reviewed 30-PNG faction UI pack"
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read
  actions: write

concurrency:
  group: import-faction-art
  cancel-in-progress: false

jobs:
  import:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 11 &&
       github.event.comment.user.login == 'krzych3d' &&
       contains(github.event.comment.body, 'github.com/user-attachments/'))
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Verify owner-provided GitHub file URL
        env:
          ZIP_INPUT: ${{ inputs.zip_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.parse
          url = os.environ.get("ZIP_INPUT", "").strip()
          if not url:
              links = re.findall(r'https://github[.]com/user-attachments/(?:files|assets)/[^\s<>\)"]+', os.environ.get("COMMENT_BODY", ""))
              if not links:
                  raise SystemExit("Missing GitHub ZIP attachment in owner comment")
              url = links[-1].rstrip(".,")
          parsed = urllib.parse.urlsplit(url)
          if parsed.scheme != "https" or parsed.hostname != "github.com" or not parsed.path.startswith("/user-attachments/"):
              raise SystemExit("Only GitHub-owned HTTPS attachments are allowed")
          if parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit("Unexpected URL authentication/parameters")
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write("FACTION_UI_URL=" + url + "\n")
          print("Validated official GitHub attachment URL")
          PY
      - name: Import the 30 full-color PNG cards atomically
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 90 --max-filesize 16000000 "$FACTION_UI_URL" -o /tmp/faction-menus.zip
          python3 -m pip install --quiet --disable-pip-version-check Pillow==11.3.0
          python3 ci/import_faction_illustrations.py /tmp/faction-menus.zip
      - name: Push validated art to main
        id: result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui/direct/{elf,dwarf,goblin}_*.png
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Images already present: no repeat commit"
          else
            git commit -m "Ship race-specific generated hero/trap cards and abilities"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run Godot and Android APK for the imported art
        if: steps.result.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub bot commits do not trigger push workflows; dispatch manually.
          gh workflow run godot-ci.yml --ref main
          gh workflow run android-debug.yml --ref main
          echo "Explicit validation and APK build dispatched from the art commit"
