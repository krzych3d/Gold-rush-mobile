name: Import 10 epic animation sheets

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "HTTPS GitHub issue attachment URL for vault-wars-epic-animations.zip"
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

concurrency:
  group: epic-animations-import
  cancel-in-progress: false

jobs:
  import:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 2 &&
       github.event.comment.user.login == 'krzych3d' &&
       contains(github.event.comment.body, 'github.com/user-attachments/'))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Locate validated GitHub ZIP attachment
        id: source
        env:
          ZIP_INPUT: ${{ inputs.zip_url }}
          ISSUE_COMMENT: ${{ github.event.comment.body }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.parse
          uri = os.environ["ZIP_INPUT"].strip()
          if not uri:
              found = re.findall(r'https://github[.]com/user-attachments/(?:files|assets)/[^\s)<>"]+', os.environ["ISSUE_COMMENT"])
              if not found:
                  raise SystemExit("No GitHub user-attachment URL found in comment")
              uri = found[-1].rstrip(".,")
          parsed = urllib.parse.urlsplit(uri)
          if parsed.scheme != "https" or parsed.hostname != "github.com":
              raise SystemExit("Only GitHub HTTPS attachments are allowed")
          if not parsed.path.startswith("/user-attachments/") or parsed.username or parsed.password:
              raise SystemExit("Only GitHub uploaded attachments are allowed")
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write("EPIC_ZIP_URL=" + uri + "\n")
          print("Accepted GitHub-hosted animation package")
          PY
      - name: Download and validate all PNG animation frames
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --max-time 90 --max-filesize 30000000 "$EPIC_ZIP_URL" -o /tmp/epic-animations.zip
          python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python3 ci/import_epic_atlases.py /tmp/epic-animations.zip
      - name: Commit validated atlases
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/epic/animations/*_sheet.png
          if git diff --cached --quiet; then
            echo "Already imported: no changes"
          else
            git commit -m "Import 10 generated epic fantasy character animation atlases"
            git push origin HEAD:main
          fi
