name: Godot validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.gd'
      - '**/*.tscn'
      - '**/*.tres'
      - 'project.godot'
      - '.github/workflows/godot-ci.yml'
  pull_request:
    paths:
      - '**/*.gd'
      - '**/*.tscn'
      - '**/*.tres'
      - 'project.godot'
      - '.github/workflows/godot-ci.yml'
permissions:
  contents: read
concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.2.2 headless
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          mv Godot_v4.2.2-stable_linux.x86_64 godot
      - name: Import project and check scripts
        run: |
          ./godot --headless --path . --editor --import --quit
          ./godot --headless --path . --quit-after 5
