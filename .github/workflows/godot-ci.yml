name: Godot validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.gd'
      - '**/*.tscn'
      - '**/*.tres'
      - 'assets/**'
      - 'project.godot'
      - '.github/workflows/godot-ci.yml'
permissions:
  contents: read
concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.2.2 headless
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          mv Godot_v4.2.2-stable_linux.x86_64 godot
      - name: Import project and check scripts
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --editor --import --quit 2>&1 | tee import.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Cannot load script" import.log; then exit 1; fi
          ./godot --headless --path . --quit-after 5 2>&1 | tee smoke.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" smoke.log; then exit 1; fi
      - name: Test character atlases and animation studio
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://ci/smoke_animation_gallery.gd 2>&1 | tee gallery.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" gallery.log; then exit 1; fi
          ./godot --headless --path . --script res://ci/smoke_visual_consistency.gd 2>&1 | tee visual.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|ERROR:" visual.log; then exit 1; fi
          grep -q "Visual consistency PASSED" visual.log
      - name: Test functional HUD, race icons, purchases and turret animation
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://ci/smoke_epic_hud.gd 2>&1 | tee hud.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|ERROR:" hud.log; then exit 1; fi
          grep -q "Epic HUD regression PASSED" hud.log
      - name: Test real illustrated PNG UI and interactive controls
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://ci/smoke_original_hud.gd 2>&1 | tee realhud.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|ERROR:" realhud.log; then exit 1; fi
          grep -q "Original illustrated HUD smoke PASSED" realhud.log
      - name: Test cinematic navigation, vault upgrades and original result music
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://ci/smoke_cinematic_ui.gd 2>&1 | tee cinematic.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|ERROR:" cinematic.log; then exit 1; fi
          grep -q "Cinematic UI smoke PASSED" cinematic.log
      - name: Test lobby, reference guide and mobile presentation profiles
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://ci/smoke_lobby_codex.gd 2>&1 | tee lobby.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|ERROR:" lobby.log; then exit 1; fi
          grep -q "Lobby and codex PASSED" lobby.log
      - name: Test full-screen battle, visible gold and sliding arsenal
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/asset_manifest.py --check
          ./godot --headless --path . --script res://ci/smoke_battle_presentation.gd 2>&1 | tee presentation.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:" presentation.log; then exit 1; fi
          grep -q "Battle presentation PASSED" presentation.log
          ./godot --headless --path . --script res://ci/smoke_battlefield_choices.gd 2>&1 | tee battlefields.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:" battlefields.log; then exit 1; fi
          grep -q "Battlefield choices PASSED" battlefields.log
      - name: Test PL and EN, saved language and localized battle cards
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://ci/smoke_localization.gd 2>&1 | tee languages.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:" languages.log; then exit 1; fi
          grep -q "Localization PASSED" languages.log
      - name: Test account levels, persistent XP and race unlocks
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://ci/smoke_account_progress.gd 2>&1 | tee account.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:" account.log; then exit 1; fi
          grep -q "Account progression PASSED" account.log
      - name: Test large battle cards and gold-to-XP rewards
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://ci/smoke_reward_presentation.gd 2>&1 | tee reward-ui.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:" reward-ui.log; then exit 1; fi
          grep -q "Reward presentation PASSED" reward-ui.log
      - name: Test guided tutorial, real clicks, isolation and phone layouts
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://ci/smoke_guided_tutorial.gd 2>&1 | tee tutorial.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:" tutorial.log; then exit 1; fi
          grep -q "Guided tutorial PASSED" tutorial.log
      - name: Test faction balance and strategy counters in the shipping simulator
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://ci/smoke_balance.gd 2>&1 | tee balance.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:" balance.log; then exit 1; fi
          grep -q "Balance regression PASSED" balance.log
          ./godot --headless --path . --script res://ci/balance_tournament.gd -- --full --report=balance-report.json 2>&1 | tee tournament.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:" tournament.log; then exit 1; fi
          grep -q "Balance tournament PASSED" tournament.log
      - name: Test costume unlocks, persistence, campaign overrides and animation inventory
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://ci/smoke_skins.gd 2>&1 | tee skins.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:" skins.log; then exit 1; fi
          grep -q "Campaign skins PASSED" skins.log
      - name: Test campaign state, mobile story UI and actual playthroughs
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://ci/smoke_story_campaign.gd 2>&1 | tee story.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:" story.log; then exit 1; fi
          grep -q "Story campaign PASSED" story.log
          ./godot --headless --path . --script res://ci/campaign_playthrough.gd -- --report=campaign-playthrough.json 2>&1 | tee playthrough.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:" playthrough.log; then exit 1; fi
          grep -q "Campaign playthrough PASSED" playthrough.log
      - name: Preserve balance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-report
          path: |
            balance-report.json
            balance.log
            tournament.log
            story.log
            playthrough.log
            campaign-playthrough.json
          retention-days: 7
          if-no-files-found: ignore
