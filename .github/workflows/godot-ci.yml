name: Godot validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.gd'
      - '**/*.tscn'
      - '**/*.tres'
      - 'assets/**'
      - 'project.godot'
      - '.github/workflows/godot-ci.yml'
  pull_request:
    paths:
      - '**/*.gd'
      - '**/*.tscn'
      - '**/*.tres'
      - 'assets/**'
      - 'project.godot'
      - '.github/workflows/godot-ci.yml'
permissions:
  contents: read
concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.2.2 headless
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          mv Godot_v4.2.2-stable_linux.x86_64 godot
      - name: Import project and check scripts
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --editor --import --quit 2>&1 | tee import.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Cannot load script" import.log; then exit 1; fi
          ./godot --headless --path . --quit-after 5 2>&1 | tee smoke.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" smoke.log; then exit 1; fi
      - name: Test character atlases and animation studio
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://ci/smoke_animation_gallery.gd 2>&1 | tee gallery.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" gallery.log; then exit 1; fi
      - name: Test functional HUD, race icons, purchases and turret animation
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://ci/smoke_epic_hud.gd 2>&1 | tee hud.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|ERROR:" hud.log; then exit 1; fi
          grep -q "Epic HUD regression PASSED" hud.log
      - name: Test real illustrated PNG UI and interactive controls
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://ci/smoke_original_hud.gd 2>&1 | tee realhud.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|ERROR:" realhud.log; then exit 1; fi
          grep -q "Original illustrated HUD smoke PASSED" realhud.log
      - name: Test cinematic navigation, vault upgrades and original result music
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://ci/smoke_cinematic_ui.gd 2>&1 | tee cinematic.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|ERROR:" cinematic.log; then exit 1; fi
          grep -q "Cinematic UI smoke PASSED" cinematic.log
      - name: Test lobby, reference guide and mobile presentation profiles
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://ci/smoke_lobby_codex.gd 2>&1 | tee lobby.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|ERROR:" lobby.log; then exit 1; fi
          grep -q "Lobby and codex PASSED" lobby.log
      - name: Test full-screen battle, visible gold and sliding arsenal
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/asset_manifest.py --check
          ./godot --headless --path . --script res://ci/smoke_battle_presentation.gd 2>&1 | tee presentation.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:" presentation.log; then exit 1; fi
          grep -q "Battle presentation PASSED" presentation.log
      - name: Test PL and EN, saved language and localized battle cards
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path . --script res://ci/smoke_localization.gd 2>&1 | tee languages.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:" languages.log; then exit 1; fi
          grep -q "Localization PASSED" languages.log
