name: Import real generated fantasy HUD artwork

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: GitHub issue attachment URL for vault-wars-original-illustrated-hud.zip
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: write
  issues: read

concurrency:
  group: import-original-illustrated-hud
  cancel-in-progress: false

jobs:
  import:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 9 &&
       github.event.comment.user.login == 'krzych3d' &&
       contains(github.event.comment.body, 'github.com/user-attachments/'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Read one GitHub issue ZIP attachment
        env:
          ZIP_INPUT: ${{ inputs.zip_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.parse
          url = os.environ.get("ZIP_INPUT", "").strip()
          if not url:
              found = re.findall(r'https://github[.]com/user-attachments/(?:files|assets)/[^\s<>\)\"]+', os.environ.get("COMMENT_BODY", ""))
              if not found:
                  raise SystemExit("No ZIP attachment in this issue comment")
              url = found[-1].rstrip(".,")
          parsed = urllib.parse.urlsplit(url)
          if parsed.scheme != "https" or parsed.netloc != "github.com" or not parsed.path.startswith("/user-attachments/") or parsed.query:
              raise SystemExit("Only GitHub HTTPS user attachments are allowed")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write("ILLUSTRATED_ZIP_URL=" + url + "\n")
          PY
      - name: Fetch and verify 27 exact generated RGBA PNGs
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 90 --max-filesize 24000000 "$ILLUSTRATED_ZIP_URL" --output /tmp/generated-hud.zip
          python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python3 ci/import_illustrated_hud.py /tmp/generated-hud.zip
      - name: Commit original illustrated art to the game
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui/direct/*.png
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already installed identical images"
          else
            git commit -m "Import exact generated premium fantasy HUD PNG asset pack"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the APK from the actual imported art commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub Actions won't trigger push workflows from GITHUB_TOKEN pushes.
          # Dispatch both explicit workflows after image files are on main.
          gh workflow run godot-ci.yml --ref main
          gh workflow run android-debug.yml --ref main
          echo "Validation and Android build dispatched with newly imported images"
