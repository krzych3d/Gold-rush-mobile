name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - '**/*.gd'
      - '**/*.tscn'
      - '**/*.tres'
      - 'assets/**'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: write

concurrency:
  group: android-debug
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_VERSION: "4.2.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          printf 'y\\n' | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-33" "build-tools;33.0.2"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/build-tools/33.0.2"
      - name: Install Godot and export templates
        run: |
          curl -fL --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          curl -fL --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d template_extract
          cp template_extract/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Create ephemeral debug keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import os
          preset = Path("export_presets.cfg")
          data = preset.read_text()
          key = Path(os.environ["RUNNER_TEMP"]) / "debug.keystore"
          data += '\nkeystore/debug="%s"\nkeystore/debug_user="androiddebugkey"\nkeystore/debug_password="android"\n' % key
          preset.write_text(data)
          PY
      - name: Render original fantasy soundtrack (offline, no game CPU cost)
        run: python3 ci/render_menu_music.py
      - name: Import and export debug APK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME JAVA_HOME=$JAVA_HOME"
          ./godot --headless --path . --editor --import --quit 2>&1 | tee import.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Cannot load script" import.log; then
            echo "::error::Godot script or scene failed to load; refusing to publish a broken APK."
            exit 1
          fi
          echo "Smoke-testing startup scene..."
          ./godot --headless --path . --quit-after 15 2>&1 | tee smoke.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Cannot load script|Invalid call|Invalid access" smoke.log; then
            echo "::error::Startup smoke test failed."
            exit 1
          fi
          echo "Checking lobby, guide and race navigation before packaging..."
          ./godot --headless --path . --script res://ci/smoke_lobby_codex.gd 2>&1 | tee lobby.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|ERROR:" lobby.log; then exit 1; fi
          grep -q "Lobby and codex PASSED" lobby.log
          ./godot --headless --path . --script res://ci/smoke_battle_presentation.gd 2>&1 | tee presentation.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:" presentation.log; then exit 1; fi
          grep -q "Battle presentation PASSED" presentation.log
          ./godot --headless --path . --script res://ci/smoke_battlefield_choices.gd 2>&1 | tee battlefields.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:" battlefields.log; then exit 1; fi
          grep -q "Battlefield choices PASSED" battlefields.log
          ./godot --headless --path . --script res://ci/smoke_localization.gd 2>&1 | tee languages.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|ERROR:" languages.log; then exit 1; fi
          grep -q "Localization PASSED" languages.log
          ./godot --headless --path . --script res://ci/smoke_account_progress.gd 2>&1 | tee account.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:" account.log; then exit 1; fi
          grep -q "Account progression PASSED" account.log
          ./godot --headless --path . --script res://ci/smoke_reward_presentation.gd 2>&1 | tee reward-ui.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:" reward-ui.log; then exit 1; fi
          grep -q "Reward presentation PASSED" reward-ui.log
          ./godot --headless --editor --path . --script res://ci/configure_android.gd 2>&1 | tee configure.log
          echo "Export templates:"
          ls -lh "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" | head -25
          echo "Installed Android build tools:"
          ls -1 "$ANDROID_HOME/build-tools"
          echo "Android export template files:"
          test -s "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_release.apk"
          echo "Keystore:"
          test -s "$RUNNER_TEMP/debug.keystore"
          echo "Export preset signing values:"
          grep -E "^(name|platform|keystore/debug|keystore/debug_user)=" export_presets.cfg
          mkdir -p build
          ./godot --headless --verbose --path . --export-debug Android build/gold-rush-debug.apk 2>&1 | tee export.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script|Cannot load script" export.log; then
            echo "::error::Godot reported a script error during export."
            exit 1
          fi
          test -s build/gold-rush-debug.apk
          echo "APK size:"
          ls -lh build/gold-rush-debug.apk
      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: |
            import.log
            smoke.log
            configure.log
            lobby.log
            presentation.log
            export.log
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: gold-rush-debug-apk
          path: build/gold-rush-debug.apk
          retention-days: 3
          if-no-files-found: error
      - name: Publish direct APK in rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s build/gold-rush-debug.apk
          git fetch --no-tags origin main
          SHA="$(git rev-parse HEAD)"
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release delete debug-latest --yes --cleanup-tag
          fi
          gh release create debug-latest build/gold-rush-debug.apk#gold-rush-debug.apk \
            --target "$SHA" \
            --title "Gold Rush: Vault Wars — latest Android debug APK" \
            --notes "Automatic debug build from commit $SHA. For testing only; not a production release." \
            --prerelease
          gh release view debug-latest --json url,assets
